<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso | Soluciones Digitales</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f3f5f7;
            color: #111827;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.08);

            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #111827;
            color: white;

            font-size: 20px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            text-align: center;

            font-size: 26px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 8px 0 28px;

            text-align: center;

            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s,
                        box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;

            border: 0;
            border-radius: 10px;

            padding: 14px;

            background: #111827;
            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        button:hover {
            opacity: 0.92;
        }

        button:active {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            font-size: 13px;

            display: none;

            text-align: center;
        }

        .message.error {
            display: block;

            background: #fef2f2;
            color: #b91c1c;
        }

        .message.success {
            display: block;

            background: #f0fdf4;
            color: #15803d;
        }

        .footer {
            margin-top: 20px;

            text-align: center;

            font-size: 12px;
            color: #9ca3af;
        }

    </style>

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                SD
            </div>

            <h1>
                Acceso de clientes
            </h1>

            <p class="subtitle">
                Gestiona tu negocio desde Soluciones Digitales
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Tu contraseña"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Iniciar sesión
                </button>

            </form>

            <div
                id="message"
                class="message"
            ></div>

            <div class="footer">
                Soluciones Digitales
            </div>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>


    <!-- LOGIN -->

    <script>

        const formulario =
            document.getElementById("loginForm");

        const boton =
            document.getElementById("loginButton");

        const mensaje =
            document.getElementById("message");


        formulario.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                mensaje.className = "message";
                mensaje.textContent = "";

                boton.disabled = true;
                boton.textContent = "Accediendo...";


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signInWithPassword({
                            email: email,
                            password: password
                        });


                    if (error) {

                        console.error(
                            "Error de login:",
                            error
                        );

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "Correo o contraseña incorrectos.";

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    console.log(
                        "USUARIO AUTENTICADO:",
                        data.user
                    );


                    mensaje.className =
                        "message success";

                    mensaje.textContent =
                        "Acceso correcto. Cargando...";


                    /*
                     * De momento NO tenemos todavía
                     * el panel terminado.
                     *
                     * Por eso hacemos una pequeña
                     * comprobación del negocio.
                     */

                    const {
                        data: membership,
                        error: membershipError
                    } =
                        await supabaseClient
                            .from("business_members")
                            .select(`
                                business_id,
                                role,
                                businesses (
                                    id,
                                    name,
                                    slug
                                )
                            `)
                            .eq(
                                "user_id",
                                data.user.id
                            )
                            .limit(1)
                            .maybeSingle();


                    if (membershipError) {

                        console.error(
                            "Error comprobando negocio:",
                            membershipError
                        );

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "El usuario no tiene un negocio asociado.";

                        await supabaseClient.auth.signOut();

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    if (!membership) {

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "Este usuario no tiene ningún negocio asociado.";

                        await supabaseClient.auth.signOut();

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    console.log(
                        "NEGOCIO DEL USUARIO:",
                        membership
                    );


                    /*
                     * Todavía no redirigimos al panel.
                     *
                     * Primero comprobamos que Auth
                     * y business_members funcionan.
                     */

                    mensaje.className =
                        "message success";

                    mensaje.textContent =
                        `Acceso correcto: ${membership.businesses.name}`;


                    boton.disabled = false;
                    boton.textContent =
                        "Iniciar sesión";


                } catch (error) {

                    console.error(
                        "Error inesperado:",
                        error
                    );

                    mensaje.className =
                        "message error";

                    mensaje.textContent =
                        "Ha ocurrido un error inesperado.";

                    boton.disabled = false;
                    boton.textContent =
                        "Iniciar sesión";
                }

            }
        );

    </script>

</body>

</html>
