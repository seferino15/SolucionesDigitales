<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Soluciones Digitales</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f3f5f7;
            color: #111827;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 34px 30px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;
            background: #111827;
            color: white;

            font-size: 18px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 25px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 8px 0 28px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        input {
            width: 100%;
            height: 46px;

            padding: 0 14px;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            background: #ffffff;
            color: #111827;

            font-size: 14px;
            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            height: 48px;

            margin-top: 8px;

            border: 0;
            border-radius: 12px;

            background: #2563eb;
            color: white;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 18px;
            padding: 12px 14px;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.4;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        .footer {
            margin-top: 22px;
            text-align: center;

            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                SD
            </div>

            <h1>Bienvenido</h1>

            <p class="subtitle">
                Accede al panel de tu negocio
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Iniciar sesión
                </button>

            </form>

            <div
                id="message"
                class="message"
            ></div>

            <div class="footer">
                Soluciones Digitales
            </div>

        </section>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuración de Supabase -->
    <script src="../js/supabase.js"></script>


    <script>

        const formulario =
            document.getElementById("loginForm");

        const boton =
            document.getElementById("loginButton");

        const mensaje =
            document.getElementById("message");


        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                boton.disabled = true;
                boton.textContent = "Iniciando sesión...";

                mensaje.className = "message";
                mensaje.textContent = "";


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                try {

                    /*
                     * 1. Iniciar sesión
                     */

                    const {
                        data: loginData,
                        error: loginError
                    } =
                        await supabaseClient.auth
                            .signInWithPassword({
                                email: email,
                                password: password
                            });


                    if (loginError) {

                        console.error(
                            "Error de login:",
                            loginError
                        );

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "Correo o contraseña incorrectos.";

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    /*
                     * 2. Comprobar usuario
                     */

                    const usuario =
                        loginData.user;


                    if (!usuario) {

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "No se ha podido identificar al usuario.";

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    /*
                     * 3. Buscar el negocio asociado
                     */

                    const {
                        data: membership,
                        error: membershipError
                    } =
                        await supabaseClient
                            .from("business_members")
                            .select(`
                                business_id,
                                role,
                                businesses (
                                    id,
                                    name,
                                    slug,
                                    active
                                )
                            `)
                            .eq("user_id", usuario.id)
                            .limit(1)
                            .maybeSingle();


                    if (membershipError) {

                        console.error(
                            "Error buscando negocio:",
                            membershipError
                        );

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "No se ha podido comprobar el negocio asociado.";

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    if (
                        !membership ||
                        !membership.businesses
                    ) {

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "Tu usuario no está asociado a ningún negocio.";

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    /*
                     * 4. Comprobar que el negocio está activo
                     */

                    if (
                        membership.businesses.active === false
                    ) {

                        mensaje.className =
                            "message error";

                        mensaje.textContent =
                            "El negocio asociado está desactivado.";

                        boton.disabled = false;
                        boton.textContent =
                            "Iniciar sesión";

                        return;
                    }


                    /*
                     * 5. Login correcto
                     */

                    mensaje.className =
                        "message success";

                    mensaje.textContent =
                        `Acceso correcto: ${membership.businesses.name}`;


                    /*
                     * 6. Ir automáticamente al panel
                     */

                    setTimeout(() => {

                        window.location.href =
                            "../panel/";

                    }, 500);


                } catch (error) {

                    console.error(
                        "Error inesperado:",
                        error
                    );

                    mensaje.className =
                        "message error";

                    mensaje.textContent =
                        "Ha ocurrido un error inesperado.";

                    boton.disabled = false;
                    boton.textContent =
                        "Iniciar sesión";
                }

            }
        );

    </script>

</body>
</html>
